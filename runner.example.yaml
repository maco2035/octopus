# runner.example.yaml — installed on each dev machine, used by
# cmd/octopus-runner. Copy to runner.yaml; ${VAR} references are expanded
# from the process environment.
server_url: ws://octopus.internal:8080/runner/connect
runner_token: ${OCTOPUS_RUNNER_TOKEN}   # generated from the web UI's Runners page
project_ids:
  - proj_abc123   # for your own reference only — actual authorization is server-side, tied to the token
clone_cache_dir: ~/.octopus/clones      # runner-local; not synced anywhere. Actual checkouts live at clone_cache_dir/<project_id>/<run_id>
local_queue_db: ~/.octopus/runner.db    # runner-local durable queue, separate from the server's database
# No AI provider keys here — run_agent jobs receive one ephemerally per invocation (Key Design Decision 28).
# The runner does need the relevant CLIs (claude / codex / agy) actually installed to serve run_agent jobs.
