{{define "login.html"}}
<!doctype html>
<html>
<head>{{template "head" .}}<title>{{.Title}} — Octopus</title></head>
<body>
{{template "nav" .}}
<main class="centered">
  <form method="post" action="/login" class="card login-form">
    <h1>Log in</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <label>Username<input type="text" name="username" autofocus required></label>
    <label>Password<input type="password" name="password" required></label>
    <button type="submit">Log in</button>
  </form>
</main>
</body>
</html>
{{end}}
