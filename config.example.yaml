# config.example.yaml — the central server. Copy to config.yaml for local
# use, or mount it in Docker; ${VAR} references are expanded from the
# process environment.
port: 8080
agents:
  gemini_api_key: ${GEMINI_API_KEY}
  anthropic_api_key: ${ANTHROPIC_API_KEY}
  openai_api_key: ${OPENAI_API_KEY}
  xai_api_key: ${XAI_API_KEY}   # Grok
slack:
  bot_token: ${SLACK_BOT_TOKEN}
  signing_secret: ${SLACK_SIGNING_SECRET}
store:
  driver: sqlite
  dsn: ./data/octopus.db
git:
  branch_pattern: "octopus/{ticket_id}"
web:
  enabled: true
auth:
  admin_username: ${OCTOPUS_ADMIN_USERNAME}
  # generate with: go run ./cmd/octopus hash-password
  admin_password_hash: ${OCTOPUS_ADMIN_PASSWORD_HASH}
