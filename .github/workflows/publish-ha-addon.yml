# Builds and publishes the Home Assistant add-on image to GHCR.
#
# Why this exists: letting Supervisor build the add-on locally (the
# build.yaml path) hit a real Supervisor bug — every install failed at
# startup with "Invalid token for access /addons/self/options/config" in
# the Supervisor log, immediately after a fresh build/install, matching
# home-assistant/supervisor#4111 and #1930 (both specific to locally-built
# add-ons). Supervisor's own build log also flags build.yaml as deprecated.
# Publishing a pre-built image and pointing config.yaml's `image:` field at
# it sidesteps Supervisor's local-build path entirely.
#
# One-time manual step after this first runs: GHCR packages default to
# private. Go to the repo's Packages tab (or
# https://github.com/users/<owner>/packages/container/<pkg>/settings) and
# set each octopus-addon-<arch> package to Public — otherwise Supervisor,
# which pulls anonymously, can't fetch it.
name: Publish HA add-on image

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "config.yaml"
      - "VERSION"
      - ".github/workflows/publish-ha-addon.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base:3.19
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base:3.19
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for the aarch64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/octopus-addon-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/octopus-addon-${{ matrix.arch }}:latest
