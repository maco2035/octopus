services:
  octopus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OCTOPUS_ADMIN_USERNAME=${OCTOPUS_ADMIN_USERNAME:-admin}
      - OCTOPUS_ADMIN_PASSWORD=${OCTOPUS_ADMIN_PASSWORD:-admin}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - OCTOPUS_BRANCH_PATTERN=${OCTOPUS_BRANCH_PATTERN:-octopus/{ticket_id}}
      - OCTOPUS_RUNNER_ENABLED=${OCTOPUS_RUNNER_ENABLED:-false}
      - OCTOPUS_WEB_BASE_URL=${OCTOPUS_WEB_BASE_URL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
