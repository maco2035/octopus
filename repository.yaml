# Lets this repo be added directly in Home Assistant as a custom add-on
# repository (Settings > Add-ons > Add-on Store > ⋮ > Repositories). HA
# auto-discovers any folder containing a config.yaml as one add-on — here
# that's the repo root itself. config.yaml's `image:` field tells
# Supervisor to pull a pre-built image from GHCR
# (.github/workflows/publish-ha-addon.yml) rather than building locally —
# Supervisor's local-build path (build.yaml) hit a real Supervisor bug,
# failing every install with "Invalid token for access
# /addons/self/options/config" (home-assistant/supervisor#4111, #1930).
name: "Octopus Add-ons"
url: "https://github.com/maco2035/octopus"
maintainer: "maco2035"
