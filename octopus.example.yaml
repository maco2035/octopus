# octopus.example.yaml — for running the server directly from source
# (`go run ./cmd/octopus`). Copy to octopus.yaml (gitignored) and fill in
# real values; ${VAR} references are expanded from the process
# environment. Not named config.yaml/config.example.yaml on purpose: the
# repo root's config.yaml is the Home Assistant add-on manifest, a
# completely different file — Docker and the HA add-on don't use this
# file at all, they generate their own runtime config from environment
# variables at container start (see docker-entrypoint.sh).
port: 8080
agents:
  gemini_api_key: ${GEMINI_API_KEY}
  anthropic_api_key: ${ANTHROPIC_API_KEY}
  openai_api_key: ${OPENAI_API_KEY}
  xai_api_key: ${XAI_API_KEY}   # Grok
slack:
  bot_token: ${SLACK_BOT_TOKEN}
  signing_secret: ${SLACK_SIGNING_SECRET}
store:
  driver: sqlite
  dsn: ./data/octopus.db
git:
  branch_pattern: "octopus/{ticket_id}"
  clone_cache_dir: ./data/clones   # per-run checkouts live at <this>/<project_id>/<run_id>; defaults here if empty
web:
  enabled: true
  base_url: ""   # e.g. https://octopus.example.com — used to build Slack "Open in web UI" links; defaults to http://localhost:<port>
auth:
  admin_username: ${OCTOPUS_ADMIN_USERNAME}
  # generate with: go run ./cmd/octopus hash-password
  admin_password_hash: ${OCTOPUS_ADMIN_PASSWORD_HASH}
